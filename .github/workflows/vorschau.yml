# Live-Vorschau. Die Adresse ergibt sich aus dem Ort des Repositorys:
#   Riantetova/ProClean-Solution              -> riantetova.github.io/ProClean-Solution/
#   procleansolution/procleansolution.github.io -> procleansolution.github.io/
# Der Build leitet den Basispfad selbst daraus ab.
#
# Die Seite läuft vollständig im Browser — kein Server, keine API-Routen,
# keine Server Actions. Genau die Entscheidung, die den Betrieb kostenlos
# macht, erlaubt es auch, sie als statische Version auszuliefern.
#
# Veröffentlicht wird über den Branch `gh-pages`, nicht über die
# Pages-Deployment-API. Grund: die API setzt voraus, dass jemand von Hand
# "Settings -> Pages -> Source: GitHub Actions" umstellt — ein Workflow darf
# eine Pages-Seite nicht selbst anlegen. Beim Anlegen eines gh-pages-Branches
# schaltet GitHub die Vorschau bei öffentlichen Repositories dagegen von
# selbst ein. Dieser Weg braucht also nie wieder einen Handgriff.
#
# Der Branch `gh-pages` ist reines Ergebnis und wird bei jedem Lauf
# überschrieben. Änderungen gehören in den Quellcode.

name: Live-Vorschau

env:
  # Eigene Domain. Leer lassen, solange keine da ist — dann läuft die Seite
  # unter riantetova.github.io/ProClean-Solution/.
  #
  # Sobald hier z. B. "procleansolution.ch" steht, passiert zweierlei:
  # die Seite wird für die Wurzel gebaut statt für einen Unterpfad, und es
  # wird eine CNAME-Datei mitgeliefert, an der GitHub die Domain erkennt.
  # Beides muss zusammen passen, sonst lädt die Seite ohne Stylesheet.
  PAGES_DOMAIN: ""

on:
  push:
    branches: [claude/emil-kowalski-skill-design-1tr9if]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vorschau
  cancel-in-progress: false

jobs:
  bauen-und-veroeffentlichen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Abhängigkeiten
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

      # Vor der Veröffentlichung, nicht danach: eine Vorschau, die falsche
      # Preise zeigt, ist schlimmer als keine.
      - name: Preise und Antworten prüfen
        run: npm test

      - name: Typen prüfen
        run: npm run typecheck

      - name: Statische Version bauen
        run: |
          set -euo pipefail

          # Der Basispfad wird NICHT von Hand gepflegt, sondern aus dem
          # Repository abgeleitet. Sonst zeigt nach einem Umzug oder einer
          # Umbenennung jeder Pfad ins Leere und die Seite lädt ohne
          # Stylesheet — ein Fehler, den man erst im Browser sieht.
          besitzer="${GITHUB_REPOSITORY%%/*}"
          repo="${GITHUB_REPOSITORY#*/}"
          besitzer_klein="$(echo "$besitzer" | tr '[:upper:]' '[:lower:]')"
          repo_klein="$(echo "$repo" | tr '[:upper:]' '[:lower:]')"

          if [ -n "$PAGES_DOMAIN" ]; then
            # Eigene Domain: Seite an der Wurzel.
            basis=""
            adresse="https://$PAGES_DOMAIN"
            grund="eigene Domain"
          elif [ "$repo_klein" = "${besitzer_klein}.github.io" ]; then
            # Benutzer- oder Organisationsseite: ebenfalls an der Wurzel.
            basis=""
            adresse="https://${besitzer_klein}.github.io"
            grund="Organisationsseite"
          else
            # Projektseite: liegt unter /<Repositoryname>/.
            basis="/$repo"
            adresse="https://${besitzer_klein}.github.io/${repo}"
            grund="Projektseite"
          fi

          echo "Basispfad: '${basis}'  Adresse: ${adresse}  (${grund})"
          # Die Adresse geht mit in den Build: kanonischer Verweis, Open Graph,
          # Sitemap und strukturierte Daten brauchen sie absolut.
          STATIC_EXPORT=1 PAGES_BASE="$basis" NEXT_PUBLIC_SITE_URL="$adresse" npx next build

          if [ -n "$PAGES_DOMAIN" ]; then
            echo "$PAGES_DOMAIN" > out/CNAME
            echo "CNAME geschrieben: $PAGES_DOMAIN"
          fi

      - name: Veröffentlichen
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Über einen eigenen Index statt über einen Branchwechsel: so wird
          # weder das Arbeitsverzeichnis noch der Index des Projekts angefasst.
          # `-f`, weil out/ in .gitignore steht.
          #
          # Der Pfad darf NICHT existieren: `mktemp` legt eine leere Datei an,
          # und git lehnt eine leere Datei als Index ab
          # ("index file smaller than expected"). Er muss ihn selbst anlegen.
          IDX="${RUNNER_TEMP}/gh-pages-index"
          rm -f "$IDX"
          GIT_INDEX_FILE="$IDX" git --work-tree=out add -A -f .
          TREE="$(GIT_INDEX_FILE="$IDX" git write-tree)"
          COMMIT="$(git commit-tree "$TREE" -m "Statische Vorschau, gebaut aus ${GITHUB_SHA:0:7}")"
          rm -f "$IDX"

          git push -f origin "$COMMIT:refs/heads/gh-pages"
          echo "Veröffentlicht: https://riantetova.github.io/ProClean-Solution/"
